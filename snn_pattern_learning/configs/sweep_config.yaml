program: train_sweep.py
method: bayes
metric:
  name: final_loss
  goal: minimize

parameters:
  # Learning rate (log scale)
  learning_rate:
    distribution: log_uniform_values
    min: 0.001
    max: 0.3

  # Neuron threshold
  neuron_threshold:
    distribution: uniform
    min: 0.3
    max: 1.0

  # Weight scale
  weight_scale:
    distribution: uniform
    min: 0.1
    max: 1.0

  # Membrane time constant
  init_tau:
    distribution: uniform
    min: 0.3
    max: 0.95

  # Kernel size (discrete values)
  kernel_size:
    values: [3, 5, 7, 9, 11, 13, 15]

  # Kernel decay rate
  kernel_decay_rate:
    distribution: uniform
    min: 0.5
    max: 5.0

  # Subthreshold width for surrogate gradient
  subthresh:
    distribution: uniform
    min: 0.1
    max: 0.5

  # Gamma for surrogate gradient
  gamma:
    distribution: uniform
    min: 0.1
    max: 1.0

early_terminate:
  type: hyperband
  min_iter: 20
  eta: 3
  s: 2

run_cap: 200
