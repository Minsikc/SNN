# SW-only baseline matching eprop_hardware_demo.yaml exactly.
# Uses MockMemristorInterface so the optimizer / reset / data path is identical
# to the real-HW run, but the "HW" gradient is the exact software outer-product
# (no stochastic pulses, no ADC). Auto-calibration is disabled and the scale is
# 1.0 so the SW desired gradient is applied verbatim.

experiment:
  type: "basic"
  name: "eprop_teacher_swonly"
  save_results: true
  results_dir: "results/eprop_teacher_swonly"

model:
  type: "RSNN_eprop_HW_forward"
  n_in: 10
  n_hidden: 5
  n_out: 5
  recurrent: true
  init_tau: 0.6
  init_thresh: 0.2
  init_tau_o: 0.6
  gamma: 0.3
  subthresh: 0.5
  weight_scale: 0.5
  width: 1

  hardware:
    enabled: true
    use_mock_hw: true        # SW path via mock interface
    serial_port: "COM4"
    baud_rate: 115200
    timeout: 30.0
    bit_length: 10
    pulse_width: 1
    pulse_pre: 100
    pulse_post: 100
    pulse_zero: 10
    read_time: 10
    read_delay: 10
    adc_to_grad_scale: 1.0   # mock returns SW outer product directly
    auto_calibrate_scale: false
    calibrate_ema: 0.5

dataset:
  # teacher-generated targets: a perfect solution provably exists
  type: "CustomSpikeDataset_Teacher"
  num_samples: 5
  sequence_length: 20
  spike_prob: 0.2
  seed: 0

training:
  batch_size: 1
  learning_rate: 0.01
  epochs: 60
  optimizer: "Adam"

kernel:
  size: 3
  decay_rate: 2.0

logging:
  enable_logger: false
  enable_pattern_analyzer: false
  save_plots: true
  plot_format: "png"
  log_level: "INFO"

wandb:
  enabled: false
